name: Explore

on:
  push:
    branches: ["explore/**"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # Original-Modelle (ONNX) als Release-Dateien bereitstellen, um sie lokal untersuchen zu können.
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Laden und hochladen
        run: |
          set -e
          gh release view models-src >/dev/null 2>&1 || gh release create models-src --prerelease --title "Original-Modelle (Untersuchung)" --notes "Nur zur Entwicklung."
          mkdir -p out && cd out
          curl -sSfL https://huggingface.co/api/models/monkt/paddleocr-onnx | python3 -c "import json,sys; [print(s['rfilename']) for s in json.load(sys.stdin)['siblings']]" | tee files.txt
          for f in $(grep -E '^detection/' files.txt); do
            curl -sSfL -o "$(echo $f | tr '/' '_')" "https://huggingface.co/monkt/paddleocr-onnx/resolve/main/$f"
          done
          for f in $(grep -E '^languages/(german|latin)/' files.txt); do
            curl -sSfL -o "$(echo $f | tr '/' '_')" "https://huggingface.co/monkt/paddleocr-onnx/resolve/main/$f"
          done
          ls -la
          gh release upload models-src * --clobber -R ${{ github.repository }}
