name: Explore

on:
  push:
    branches: ["explore/**"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ci/explore/opensubs.sh explore-out || true
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
      - name: Ergebnisse veröffentlichen
        if: always()
        run: |
          mkdir -p explore-out && rm -rf explore-out/m && cd explore-out
          git init -q -b explore-results
          git config user.name "Ayu-TV CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Erkundung ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" explore-results
