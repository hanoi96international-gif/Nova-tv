name: EPG-Probe-2
on:
  push:
    branches: [epg-probe2]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sendungen ansehen
        run: |
          set +e
          mkdir out && cd out
          for f in DE1 AT1 CH1; do
            curl -sSL -m 120 -o "../$f.gz" "https://epgshare01.online/epgshare01/epg_ripper_${f}.xml.gz" && zcat "../$f.gz" > "../$f.xml"
          done
          python3 - <<'PY'
          import re
          for f in ["DE1","AT1","CH1"]:
              data = open("../%s.xml" % f, encoding="utf-8", errors="replace").read()
              progs = re.findall(r'(<programme[^>]*channel="([^"]*)"[^>]*>.*?</programme>)', data, re.S)
              tags = {}
              out = open("%s.samples.xml" % f, "w")
              n = 0
              for block, ch in progs:
                  for t in re.findall(r'<([a-z-]+)[ >]', block): tags[t] = tags.get(t, 0) + 1
                  if re.search(r'(?i)bundesliga|dazn|sky\.sport|sport1|eurosport|magenta', ch) and n < 400:
                      out.write(block + "\n"); n += 1
              open("%s.tags.txt" % f, "w").write("\n".join("%s %d" % kv for kv in sorted(tags.items(), key=lambda x: -x[1])))
          PY
          git init -q -b epg-probe2-results && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm results && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" epg-probe2-results
