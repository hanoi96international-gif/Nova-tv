name: EPG-Probe-5
on:
  push:
    branches: [epg-probe5]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Programmschnittstellen ansehen
        run: |
          set +e
          mkdir out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          D=$(date -u +%Y-%m-%d)
          get() { curl -sSL --compressed -m 60 -A "$UA" -H "Accept: application/json" "$2" -o "$1"; echo "$1 $(stat -c %s "$1") $2" >> index.txt; }
          B=https://production-cdn.d3.dyn.sport/api
          get dyn_channels_page.json "$B/page?path=/channels&device=web_browser&sub=Anonymous"
          get dyn_channels_page2.json "$B/page?path=%2Fchannels&device=web_browser&sub=Anonymous&segments=de"
          get dyn_volley_page.json "$B/page?path=/volleyball&device=web_browser&sub=Anonymous"
          get dyn_live_page.json "$B/page?path=/live&device=web_browser&sub=Anonymous"
          get dyn_home_page.json "$B/page?path=/&device=web_browser&sub=Anonymous"
          get dyn_config.json "$B/config?device=web_browser&sub=Anonymous"
          get dyn_sitemap.html "https://www.dyn.sport/channels"
          get dyn_volley_web.html "https://www.dyn.sport/volleyball"
          # Kanal-IDs aus der Kanalseite, dann Programm
          IDS=$(grep -oE '"type":"channel"[^}]{0,400}' dyn_*.json dyn_sitemap.html | grep -oE '"id":"[0-9]+"' | grep -oE '[0-9]+' | sort -u | head -30 | paste -sd, -)
          echo "IDS=$IDS" >> index.txt
          [ -n "$IDS" ] && get dyn_schedules.json "$B/schedules?channels=$IDS&date=$D&hour=0&duration=24&device=web_browser&sub=Anonymous"
          get dyn_schedules_guess.json "$B/schedules?date=$D&hour=0&duration=24&device=web_browser&sub=Anonymous"
          # TV Spielfilm (live.tvspielfilm.de) und TV Movie
          get tvs_channels.json "https://live.tvspielfilm.de/static/content/channel-list/livetv"
          get tvs_dynmx.json "https://live.tvspielfilm.de/static/broadcast/list/DYNMX/$D"
          get tvs_dynhl.json "https://live.tvspielfilm.de/static/broadcast/list/DYNHL/$D"
          get tvmovie_dyn.html "https://www.tvmovie.de/tv/sender/dyn-highlights"
          get tvmovie_api.json "https://www.tvmovie.de/api/v2/broadcasts?channel=DYNHL&date=$D"
          # MagentaTV: iptv-org Senderliste und Abfrage
          get iptvorg_magenta_channels.xml "https://raw.githubusercontent.com/iptv-org/epg/master/sites/web.magentatv.de/web.magentatv.de.channels.xml"
          get iptvorg_magenta_config.js "https://raw.githubusercontent.com/iptv-org/epg/master/sites/web.magentatv.de/web.magentatv.de.config.js"
          get iptvorg_tvspielfilm_channels.xml "https://raw.githubusercontent.com/iptv-org/epg/master/sites/tvspielfilm.de/tvspielfilm.de.channels.xml"
          get iptvorg_tvspielfilm_config.js "https://raw.githubusercontent.com/iptv-org/epg/master/sites/tvspielfilm.de/tvspielfilm.de.config.js"
          get iptvorg_sites.json "https://api.github.com/repos/iptv-org/epg/contents/sites"
          for s in magentatv.de tvmovie.de hd-plus.de zattoo.com waipu.tv sky.de tv.magenta.at horizon.tv tvtoday.de tvdigital.de prosiebensat1.de; do
            get "iptvorg_$s.channels.xml" "https://raw.githubusercontent.com/iptv-org/epg/master/sites/$s/$s.channels.xml"
          done
          find . -size -1k -name '*.json' -exec sh -c 'echo "== $1"; cat "$1"; echo' _ {} \; >> small.txt
          git init -q -b epg-probe5-results && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm results && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" epg-probe5-results
