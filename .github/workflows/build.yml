name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests und APKs bauen
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/NovaTV-${GITHUB_SHA::7}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/NovaTV-debug-${GITHUB_SHA::7}.apk

      - uses: actions/upload-artifact@v5
        with:
          name: NovaTV-apk
          path: out/*.apk

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/NovaTV-*.apk
