name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # FFmpeg-Tondecoder (DTS, TrueHD, AC-3/E-AC-3 …) für Media3 bauen. Dauert beim ersten Mal einige
  # Minuten, danach kommt das Ergebnis aus dem Cache (Schlüssel: Bauskript + Media3-Version).
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-aar
          key: media3-ffmpeg-${{ hashFiles('ci/build-ffmpeg.sh') }}

      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: FFmpeg-Erweiterung bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/build-ffmpeg.sh ffmpeg-aar /tmp/ffmpeg-build

      - uses: actions/upload-artifact@v5
        with:
          name: ffmpeg-aar
          path: ffmpeg-aar/*.aar

  build:
    needs: ffmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: ffmpeg-aar
          path: app/libs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests und APKs bauen
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DnA-TV.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DnA-TV-debug.apk

      - uses: actions/upload-artifact@v5
        with:
          name: DnA-TV-apk
          path: out/*.apk

      - name: Versionsnummer lesen
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # Jede neue Version (versionName) auf main erzeugt ein eigenes Release mit Tag v<versionName>.
      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: DnA-TV ${{ steps.version.outputs.name }}
          make_latest: true
          overwrite_files: true
          files: out/DnA-TV*.apk

  # Rundgang auf einem Android-TV-Emulator: echte Wiedergabe, Screenshots, Messwerte.
  # Fire TV Stick 4K hat einen 32-Bit-ARM-Prozessor: App mit armeabi-v7a-Bibliotheken im Emulator
  # (Android 11 übersetzt ARM-Code) und Texterkennung/Übersetzung prüfen. Ergebnis im Branch arm-results.
  arm32:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: ffmpeg-aar
          path: app/libs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APKs bauen
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Selbsttest mit 32-Bit-ARM
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          # Google-APIs-Abbild: enthält die ARM-Übersetzung (native bridge) für 32-Bit-ARM-Apps.
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          disable-animations: true
          script: ci/run-arm-selftest.sh
      - name: Ergebnisse veröffentlichen
        if: always()
        run: |
          mkdir -p arm-out && cd arm-out
          echo "${{ github.sha }}" > COMMIT
          git init -q -b arm-results
          git config user.name "DnA-TV CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "ARM-Ergebnisse für ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" arm-results

  # Ergebnisse landen im Branch ci-results (Screenshots, results.txt, gfxinfo, logcat).
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: ffmpeg-aar
          path: app/libs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testinhalte erzeugen und bereitstellen
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ci/make-test-media.sh ci-media
          nohup python3 ci/test_server.py ci-media > http.log 2>&1 &

      - name: APKs bauen
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest assembleRelease

      # Upgrade-Test: Die Version aus main zuerst installieren, dann die neue darüber. So fällt eine
      # fehlerhafte Datenbank-Migration auf, bevor sie auf dem Fire TV die Playlists kostet.
      - name: Vorversion bauen (Upgrade-Test)
        run: |
          mkdir -p ~/.android && cp signing/ayutv.keystore ~/.android/debug.keystore
          git fetch -q --depth 1 origin main
          git worktree add -q ../previous FETCH_HEAD
          if (cd ../previous && ./gradlew --no-daemon assembleDebug > ../previous-build.log 2>&1); then
            cp ../previous/app/build/outputs/apk/debug/app-debug.apk previous-debug.apk
          else
            echo "Vorversion ließ sich nicht bauen, Upgrade-Test entfällt"; tail -40 ../previous-build.log
          fi

      - name: Rundgang im Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          # AOSP ohne Google-Play-Dienste: verhält sich wie Fire OS (Amazon hat keine Google-Dienste).
          target: default
          arch: x86_64
          profile: tv_1080p
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          disable-animations: true
          script: ci/run-device-tour.sh

      - name: Ergebnisse veröffentlichen
        if: always()
        run: |
          mkdir -p ci-out && cp http.log ci-out/ 2>/dev/null || true
          cd ci-out
          echo "${{ github.sha }}" > COMMIT
          git init -q -b ci-results
          git config user.name "DnA-TV CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Ergebnisse für ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
